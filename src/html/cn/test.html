<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>ECC Test</title>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 1rem; max-width: 1100px; }
  h3 { margin: 0 0 0.75rem; }
  .kv-panel {
    border: 1px solid #c8ccd4;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    background: #f7f8fa;
  }
  .kv-row { display: flex; gap: 0.5rem; align-items: flex-start; margin: 0.35rem 0; }
  .kv-label { flex: 0 0 4.5rem; color: #555; font-weight: 600; }
  .kv-value {
    flex: 1;
    word-break: break-all;
    color: #111;
    background: #fff;
    border: 1px solid #e3e6ea;
    border-radius: 4px;
    padding: 0.35rem 0.5rem;
    min-height: 1.4em;
  }
  .file-panel .kv-label { flex: 0 0 5.5rem; }
  .file-panel input[type="file"] { flex: 1; font-size: 0.875rem; }
  pre#results { white-space: pre-wrap; word-break: break-all; overflow-x: auto; border: 1px solid #e3e6ea; border-radius: 8px; padding: 0.75rem; background: #fff; }
</style>
</head>
<body>
<h3>ECC 加解密测试</h3>
<div class="kv-panel">
  <div class="kv-row"><span class="kv-label">Key</span><div id="showKey" class="kv-value">—</div></div>
  <div class="kv-row"><span class="kv-label">IV</span><div id="showIv" class="kv-value">—</div></div>
</div>
<div class="kv-panel file-panel">
  <div style="font-weight:600;margin-bottom:0.5rem">测试14b：X. 流式（文本 MIME 先 gzip）→ 按钮触发加解密</div>
  <div class="kv-row"><span class="kv-label">选源文件</span><input type="file" id="test14bEncFile" /></div>
  <div class="kv-row"><span class="kv-label"></span><button type="button" id="test14bEncBtn" style="padding:0.4rem 1rem;cursor:pointer">加密</button></div>
  <div class="kv-row"><span class="kv-label">选密文</span><input type="file" id="test14bDecFile" /></div>
  <div class="kv-row"><span class="kv-label"></span><button type="button" id="test14bDecBtn" style="padding:0.4rem 1rem;cursor:pointer">解密</button></div>
  <div class="kv-row"><span class="kv-label">密钥</span><div class="kv-value" style="font-size:0.75rem">pub=5vuYVbe+b88u/orMF+oHdziovSh+PIfArfiMG2e7NE8=<br>pri=KJ69pcdMyroehSiBsjS9PWY51zwn5zi5XsZthQFZTFA=</div></div>
  <div class="kv-row"><span class="kv-label">说明</span><div class="kv-value">先选文件再点按钮。有 showSaveFilePicker 时流式另存为；否则回退 Blob 下载（日志会写 mode=fs / blob 回退）。</div></div>
</div>
<pre id="results"></pre>
<script src="js/app.js"></script>
</body>
</html>
