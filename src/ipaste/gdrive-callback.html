<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google Drive - Authorizing...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f2f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e3e6ea;
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .msg {
      font-size: 0.9375rem;
      color: #666;
    }
    .error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg">Authorizing with Google Drive...</div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const clientId = params.get('client_id');
      const scope = params.get('scope') || 'https://www.googleapis.com/auth/drive.file';

      if (!clientId) {
        showError('Missing client_id parameter');
        return;
      }

      const opener = window.opener;
      if (!opener) {
        showError('No opener window found. Please allow popups.');
        return;
      }

      function showError(msg) {
        document.getElementById('spinner').style.display = 'none';
        const el = document.getElementById('msg');
        el.textContent = msg;
        el.classList.add('error');
      }

      function sendToken(token) {
        try {
          opener.postMessage({ type: 'gdrive-auth-success', token }, '*');
        } catch (e) {
          showError('Failed to send token to opener: ' + e.message);
          return;
        }
        document.getElementById('msg').textContent = 'Authorization successful! Closing...';
        setTimeout(() => window.close(), 500);
      }

      function waitForGoogleAndAuth() {
        if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
          setTimeout(waitForGoogleAndAuth, 100);
          return;
        }

        try {
          const tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: scope,
            callback: (response) => {
              if (response.error) {
                showError(response.error_description || response.error);
                return;
              }
              sendToken(response.access_token);
            },
          });

          tokenClient.requestAccessToken({ prompt: 'consent' });
        } catch (e) {
          showError('Authorization error: ' + e.message);
        }
      }

      waitForGoogleAndAuth();
    })();
  </script>
</body>
</html>
